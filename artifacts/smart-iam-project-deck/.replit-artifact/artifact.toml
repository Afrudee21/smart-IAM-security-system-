kind = "slides"
previewPath = "/smart-iam-project-deck/"
title = "Smart IAM Project Deck"
description = "An enterprise-style project overview deck for the Smart IAM Security Platform, covering identity controls, RBAC, risk detection, security operations, architecture, and verification."
version = "1.0.0"
id = "artifacts/smart-iam-project-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/smart-iam-project-deck/" ]
localPort = 21582

[services.development]
run = "pnpm --filter @workspace/smart-iam-project-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-iam-project-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-iam-project-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21582"
BASE_PATH = "/smart-iam-project-deck/"
